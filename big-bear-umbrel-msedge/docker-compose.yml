version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-msedge_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/msedge:156.0.4314@sha256:d00157a6c27389bc68f26b87c407d98df5361ab65771bea6469682c25c254e01
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
