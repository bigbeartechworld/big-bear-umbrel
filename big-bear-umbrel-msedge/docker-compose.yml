version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-msedge_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/msedge:155.0.4283@sha256:4e93ca32e16e3746347277fe2e39c7d8e11faab66e84cec5a777d9a63c7e80b1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
