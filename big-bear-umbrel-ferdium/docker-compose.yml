version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ferdium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ferdium:7.2.3@sha256:dac53f9bd3a5b5d3a99c2f914ac1ca5925cf5f23c49b647768b7f454f243e62f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
