version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ferdium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ferdium:7.2.3@sha256:ee706fb59ad2855c8b5d33aa8a07bb8079c39a8493a95cc88caaf733b8e01aa5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
