version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ferdium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ferdium:7.2.3@sha256:2093ab9b3cb74d236df6b2a5d0bd3e261fa0e735785ca349c3dda24e21197502
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
