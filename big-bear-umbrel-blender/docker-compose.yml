version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-blender_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/blender:5.2.3@sha256:866069a7ea0600f80bad6f4050e9933cb3eb886b0a87ea1fa890fe5167ab0fd6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
