version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-heimdall_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/heimdall:2.8.3@sha256:3c9e97c416c7f6d72a3fc12af01a37bd0e71d9e6588d25c40b47e391f39ff7fd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
