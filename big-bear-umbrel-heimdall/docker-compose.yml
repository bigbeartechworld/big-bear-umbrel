version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-heimdall_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/heimdall:2.8.3@sha256:8e27750132a425d2631e91e13888a2bf0c975ad5d7e6f99a2fb713b3b688a9ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
