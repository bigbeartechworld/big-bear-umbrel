version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-heimdall_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/heimdall:2.8.3@sha256:4c2b77d7e391ac794ee7504839ed699a7f98309f853670ee45a7712a14c41001
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
