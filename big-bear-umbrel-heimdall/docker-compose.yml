version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-heimdall_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/heimdall:2.8.3@sha256:928b80d532929a3ff4f53bd49437c721e76334a6d4c9d3d992e522b9ccdd08c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
