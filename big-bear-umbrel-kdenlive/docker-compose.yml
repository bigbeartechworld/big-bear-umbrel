version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kdenlive_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/kdenlive:423.08.5@sha256:4c908a8d2e43d788e37f7f1193014f5303b81f452942f26c46cb2a99d7db2d3b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kdenlive/config
        target: /config
