# Configuration for big-bear-mailpit setup
version: "3.7"
# Service definitions for the big-bear-mailpit application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mailpit_app_1
      APP_PORT: "8025"
  # Service name: app
  app:
    image: axllent/mailpit:v1.30@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d # Image for the app service
    restart: unless-stopped # Restart policy for the container
    volumes: # Volumes to mount for the app service
      - ${APP_DATA_DIR}/data:/data
    environment: # Environment variables for the app service
      - TZ=UTC
