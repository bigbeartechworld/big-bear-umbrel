version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webtop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:c024d2b43174539f6a376c47d168bc7b05ec9109f921e6d49f0b01e22fefc7be
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
