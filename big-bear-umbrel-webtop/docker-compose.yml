version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webtop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:21db23d80427859457e1abada23ed51b1d876c70bfb173ad602150e0b6deec94
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
