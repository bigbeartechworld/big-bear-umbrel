# Configuration for appsmith setup
# Name of the big-bear-appsmith application
version: "3.7"
# Service definitions for the big-bear-appsmith application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-appsmith_app_1
      APP_PORT: "80"
  # Service name: app
  # The `app` service definition
  app:
    image: appsmith/appsmith-ce:v2.5.0@sha256:5b6133ab8317b98edf9dc0315a02d12f9861ab2acc89386c0b1f5b7938dfeb90 # Docker image to use
    volumes:
      - ${APP_DATA_DIR}/stacks:/appsmith-stacks # Mount volume for app data
    restart: unless-stopped # Container restart policy
