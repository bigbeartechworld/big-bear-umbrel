version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ldap-auth_app_1
      APP_PORT: ' 8888'
  app:
    image: linuxserver/ldap-auth:3.4.8@sha256:9b94624ff3dff4bcf6d7ba74a9186afe6ac334e48104bb5f688ddf6866659957
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
