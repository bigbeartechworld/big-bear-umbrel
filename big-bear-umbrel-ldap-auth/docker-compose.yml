version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ldap-auth_app_1
      APP_PORT: ' 8888'
  app:
    image: linuxserver/ldap-auth:3.4.8@sha256:34961466dc4474a8058fe22586b8f9a79bfb23b4417dec69f166bbaa463d11f2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
