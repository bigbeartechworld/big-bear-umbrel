version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-dosbox-staging_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/dosbox-staging:0.83.0@sha256:7e2b4e639da689c3a005250ad9067e1beaa7c8c493a95a4034e58705bfe29bd4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
