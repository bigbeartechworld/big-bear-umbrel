version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-luanti_app_1
      APP_PORT: ' 30000'
  app:
    image: linuxserver/luanti:5.17.0@sha256:bfdd74733bbeed3c49a5b7cecfbd2b4b5fe3d1ff813aff9ddf31cc9ccef25aea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
