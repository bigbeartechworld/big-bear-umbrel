version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-luanti_app_1
      APP_PORT: ' 30000'
  app:
    image: linuxserver/luanti:5.17.0@sha256:f0f32b6789504586db3a01e974e0b5ebe3613f50305377dbe5148708569a452c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
