version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-luanti_app_1
      APP_PORT: ' 30000'
  app:
    image: linuxserver/luanti:5.18.0@sha256:337da07b956d401e3a4ec29fe88614b4be65b99f881f5a11bd95f569c00765ca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
