version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calibre_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/calibre:9.16.0@sha256:4b1673b28f18c170e8d6c48c791e67520df44dc4f9b9e8f63fef21d23910abab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CUSTOM_USER: $CUSTOM_USER
      PASSWORD: $PASSWORD
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
