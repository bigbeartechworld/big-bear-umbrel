version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calibre_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/calibre:9.17.0@sha256:b198fc03a6abc6be7e251a9958e50e74634b00e447c7b25e92c191c8077ba378
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CUSTOM_USER: $CUSTOM_USER
      PASSWORD: $PASSWORD
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
