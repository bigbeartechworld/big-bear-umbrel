version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ngircd_app_1
      APP_PORT: ' 6667'
  app:
    image: linuxserver/ngircd:version-27-r1@sha256:a45daaa107b7c5d6d9d39011758f73f97cc104f377694bd6cdad308718794fab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
