version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-babybuddy_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/babybuddy:2.11.0@sha256:f62b64e174004fc6d9048099f78bfc9642bb59b37536e62505b0e15d2eede558
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
