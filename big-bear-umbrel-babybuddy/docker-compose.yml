version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-babybuddy_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/babybuddy:2.11.0@sha256:3f244c1a3cd06696c2e8edb40f9fda71a837a77fee06f2f5c2f96ac99c135071
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
