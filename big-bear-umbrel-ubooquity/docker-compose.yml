version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ubooquity_app_1
      APP_PORT: ' 2202'
  app:
    image: linuxserver/ubooquity:3.1.0@sha256:cfabd5ff77bcd5571df7cc5186b666d44313e89b249aaca12fe318eee7ee8cc3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MAXMEM: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ubooquity/config
        target: /config
      - type: bind
        source: /DATA/AppData/ubooquity/books
        target: /books
      - type: bind
        source: /DATA/AppData/ubooquity/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/ubooquity/files
        target: /files
