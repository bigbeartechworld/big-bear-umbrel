version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ubooquity_app_1
      APP_PORT: ' 2202'
  app:
    image: linuxserver/ubooquity:3.1.0@sha256:d2d6fde96383b679484e111deb320d720e69b9066685c63e49b3aea63aa7a8b7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MAXMEM: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ubooquity/config
        target: /config
      - type: bind
        source: /DATA/AppData/ubooquity/books
        target: /books
      - type: bind
        source: /DATA/AppData/ubooquity/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/ubooquity/files
        target: /files
