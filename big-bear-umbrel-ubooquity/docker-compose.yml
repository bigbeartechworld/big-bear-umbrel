version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ubooquity_app_1
      APP_PORT: ' 2202'
  app:
    image: linuxserver/ubooquity:3.1.0@sha256:e484ecb4aa66fd0bde885850f48c8818ee7c7cd9cdb8cd3b279a98b0fb6ec7e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MAXMEM: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ubooquity/config
        target: /config
      - type: bind
        source: /DATA/AppData/ubooquity/books
        target: /books
      - type: bind
        source: /DATA/AppData/ubooquity/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/ubooquity/files
        target: /files
