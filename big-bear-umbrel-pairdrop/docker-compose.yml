version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pairdrop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pairdrop:1.11.2@sha256:5f4504b22a75ed20606beeb1700a9324f647c480a4ccdfce100ba033c481ac15
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RATE_LIMIT: ''
      WS_FALLBACK: ''
      RTC_CONFIG: ''
      DEBUG_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pairdrop/config
        target: /config
