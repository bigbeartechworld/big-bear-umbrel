version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pairdrop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pairdrop:1.11.2@sha256:4a87eb38032ad6fd58da193cca6c625c6215bfef9760b07cf8a8d5550dc02359
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RATE_LIMIT: ''
      WS_FALLBACK: ''
      RTC_CONFIG: ''
      DEBUG_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pairdrop/config
        target: /config
