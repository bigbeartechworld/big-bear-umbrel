version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-grocy_app_1
      APP_PORT: ' 9283'
  app:
    image: linuxserver/grocy:4.7.1@sha256:cae63f6c731f6ad8a3596eef097c136934a3a076e6ae533f933182187fe85a12
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
