version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-grocy_app_1
      APP_PORT: ' 9283'
  app:
    image: linuxserver/grocy:4.7.1@sha256:6282144f9a14d4a4dca2bc96801a2e43a2ff51116f001b13e5488eacad7b80e2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
