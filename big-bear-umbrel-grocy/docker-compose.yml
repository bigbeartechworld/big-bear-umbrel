version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-grocy_app_1
      APP_PORT: ' 9283'
  app:
    image: linuxserver/grocy:4.7.1@sha256:d63bffe9afb2ef1a23fa7ce0749cdaeba9c169fb644b16eed270884a1b2f4ac9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
