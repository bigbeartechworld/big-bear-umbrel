version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-zen_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/zen:1.23.4@sha256:254661ea126d98dcedbec1bb57cd0785ebdf3521b69a6b24df0952f60f8eb5a7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
