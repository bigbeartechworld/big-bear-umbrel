version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-zen_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/zen:1.23.3@sha256:1b439526abf01d08b3c1803fe78aae9bbd4c81f8af4e1ef447b7a365a3ba23e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
