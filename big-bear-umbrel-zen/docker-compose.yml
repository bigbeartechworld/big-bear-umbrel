version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-zen_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/zen:1.23.2@sha256:0b150f21b27e0644277797a3f648b038440f5e0bf5b83fb6fd70deeeb51d7c3b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
