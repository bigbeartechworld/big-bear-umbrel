version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-digikam_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/digikam:9.1.0@sha256:553255834b2fcb5fb8001d22adf3efb6058005d067fa1c950402f1e3f3d63ca0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
