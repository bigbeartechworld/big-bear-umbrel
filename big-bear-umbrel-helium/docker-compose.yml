version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-helium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/helium:0.18.2@sha256:6c0f462961684a624857d931949b844fe338b448d5265afd964929e4164fceca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
