version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-helium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/helium:0.19.2@sha256:37a86a25692eb99afb9cd8ec8f08652b2943781240685bf6ccd4b4e19ced63f8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
