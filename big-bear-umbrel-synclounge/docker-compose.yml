version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-synclounge_app_1
      APP_PORT: ' 8088'
  app:
    image: linuxserver/synclounge:5.2.35@sha256:abbb6bd411da3f16b64a93445f6451cd314a5d9d4fe026fab3491ff0fc9e6410
    restart: unless-stopped
    environment:
      AUTH_LIST: ''
    volumes:
      - type: bind
        source: /DATA/AppData/synclounge/config
        target: /config
