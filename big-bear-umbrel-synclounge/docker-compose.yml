version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-synclounge_app_1
      APP_PORT: ' 8088'
  app:
    image: linuxserver/synclounge:5.2.35@sha256:e2121f13cd6514394bdc82a4a3df8c66b169d3a2cfae960a2f3bf9b15594e20c
    restart: unless-stopped
    environment:
      AUTH_LIST: ''
    volumes:
      - type: bind
        source: /DATA/AppData/synclounge/config
        target: /config
