version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ddclient_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ddclient:4.0.0@sha256:7fbf1f5ab2b3511b18a21ce5fd49fb48f37ca5c91dad83c25bfbaf8b63b19e06
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
