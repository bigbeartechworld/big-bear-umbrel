version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ddclient_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ddclient:4.0.0@sha256:f94b9a1c19a34e3b5500cfbfbfdee1fed7e6636fbbf7519519b0e92424223f11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
