version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kicad_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/kicad:10.0.3@sha256:37416bcb454cf6ff4e54032b3d6332cbb0276f4a0f51da3f316148fc80e18b34
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
