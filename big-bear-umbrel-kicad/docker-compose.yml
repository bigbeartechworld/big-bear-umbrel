version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kicad_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/kicad:10.0.3@sha256:1b5466f6e4c24ab82abacc326fc5690d43c7b60efecdaaf40fb3af8a7baa0f0a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
