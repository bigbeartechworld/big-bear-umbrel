version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webstation_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webstation:0.13.0-romm@sha256:97000f8ca20a459651ed664c0d03449814917e0f3ad96d9f4bf276ad4fe322a9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
