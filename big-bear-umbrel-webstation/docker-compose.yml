version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webstation_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webstation:0.15.2-romm@sha256:14e57bca54910a6e8b0b808962497aeef0bb48e2a444a7a556a0667b40111081
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
