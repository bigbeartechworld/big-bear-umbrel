version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mediaelch_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:79b05cca059fa038537fbfc7c5eb3877fb5dd3aed6fee4cb514731c5e733d3a5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
