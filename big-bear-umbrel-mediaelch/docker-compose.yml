version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mediaelch_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:62548eba071dfeaa2185bf035bd8d133ac2e68d76e9fed0a8e3fbe47a38262e3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
