version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pidgin_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pidgin:2.14.14@sha256:23b740efcbe804d544a3cb8affc6b1fdbc9151871297cd71a8db45870c9dd3bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
