version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pidgin_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pidgin:2.14.14@sha256:ae7fff6df7a21a2704000af40fadee99e7980396b7871f27dba5c5af400662c0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
