version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-openssh-server_app_1
      APP_PORT: ' 2222'
  app:
    image: linuxserver/openssh-server:version-10.3_p1-r1@sha256:46f115de7c251558297e7e87566fc3fc08544b63e55502b5cf294454db5d29d1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PUBLIC_KEY: ''
      PUBLIC_KEY_FILE: ''
      PUBLIC_KEY_DIR: ''
      PUBLIC_KEY_URL: ''
      SUDO_ACCESS: ''
      PASSWORD_ACCESS: ''
      USER_PASSWORD: ''
      USER_PASSWORD_FILE: ''
      USER_NAME: ''
      LOG_STDOUT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/openssh-server/config
        target: /config
