version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-changedetection-io_app_1
      APP_PORT: ' 5000'
  app:
    image: linuxserver/changedetection.io:0.60.9@sha256:bbdcedab4cc79d27d5fa4021cb6e9d1cf04cb711af53d291344fbaffe96adcd3
    restart: unless-stopped
