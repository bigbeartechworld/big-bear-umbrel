version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-socket-proxy_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
