version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-socket-proxy_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
