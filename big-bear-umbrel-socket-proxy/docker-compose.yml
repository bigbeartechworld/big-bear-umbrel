version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-socket-proxy_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/socket-proxy:3.4.4@sha256:a8c700baae19c2fff5b2940b21a748e78cf3b91cc311ad65f990efabdd1361eb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
