version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pelorus_app_1
      APP_PORT: ' 3001'
  app:
    image: linuxserver/pelorus:0.2.3@sha256:4f08ca20c94f78f761e6a84d38534b55960289bf104c984d850f8a2b76569e74
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
