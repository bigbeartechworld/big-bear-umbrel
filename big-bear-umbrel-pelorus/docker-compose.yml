version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pelorus_app_1
      APP_PORT: ' 3001'
  app:
    image: linuxserver/pelorus:0.2.4@sha256:cef9d489d310913c247ac2dba40f0d74134c9da0633d5521268d938912c70c54
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
