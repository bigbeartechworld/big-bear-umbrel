version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pelorus_app_1
      APP_PORT: ' 3001'
  app:
    image: linuxserver/pelorus:0.2.3@sha256:2ce1c2b9b6add922a6592cafae11481b988d3a5dc6bb7ed0634ec31db2f0bc0a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
