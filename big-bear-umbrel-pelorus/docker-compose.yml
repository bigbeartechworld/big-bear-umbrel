version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pelorus_app_1
      APP_PORT: ' 3001'
  app:
    image: linuxserver/pelorus:0.2.4@sha256:b84198035870b61a5ef4b4a1e5e2babdd0d76910dc1951840a3e60d3668c0db7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
