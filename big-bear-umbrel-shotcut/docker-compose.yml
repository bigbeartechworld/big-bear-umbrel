version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-shotcut_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/shotcut:26.9.27@sha256:2b408ec9f1e32a4a73f85d7ecec618bd42f1d3dd610b69614c1b0b3346a8c789
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
