version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-shotcut_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/shotcut:26.9.27@sha256:d78247e48e8b4dab2c95c814bb4faaae38767018590d60f0d220326375ee1856
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
