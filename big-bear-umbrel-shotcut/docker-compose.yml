version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-shotcut_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/shotcut:26.8.1@sha256:5bd6a0faccc7a1e1b1b1f09f13ae8c5646b0e426b5d76171b4f82558424847ce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
