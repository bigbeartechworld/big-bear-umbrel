version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-archivebox_app_1
      APP_PORT: ' 8000'
  app:
    image: archivebox/archivebox:0.9.51
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: '*'
      MEDIA_MAX_SIZE: 500m
      PUBLIC_INDEX: true
      PUBLIC_SNAPSHOTS: true
      PUBLIC_ADD_VIEW: true
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /data
