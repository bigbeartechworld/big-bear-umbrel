version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-grav_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/grav:2.1.10@sha256:a2adc1b3aaeb5b01518d50e07a7851be4add1e2a2cb0eb289acc3ead4370fe02
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
