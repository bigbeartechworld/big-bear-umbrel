version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-grav_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/grav:2.2.9@sha256:4946e4f4f362efe45eafad32ceedde863229a3b84465e4818535f913763c880a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
