version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mame_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:347d5184b480017de07cb984100d34e924b364cf0b8b03121df7a5bd8894e4ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
