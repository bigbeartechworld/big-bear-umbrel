version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thunderbird_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/thunderbird:1140.17.0@sha256:580b7baa630b826f599609d82013a6a17c140084756276cd5ce639d5abcdd5cd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
