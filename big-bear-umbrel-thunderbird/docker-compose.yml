version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thunderbird_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/thunderbird:1140.16.0@sha256:e438bba5d079de2a29915e2a4590fb64ed8e0ed9ab4bddef65316a65f97dc267
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
