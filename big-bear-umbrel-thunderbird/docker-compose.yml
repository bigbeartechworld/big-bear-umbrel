version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thunderbird_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/thunderbird:1140.16.0@sha256:0a3ba3d267fe1790360db9168b6f1b8be4d319022034b1f6dd2e3c7aa88458ac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
