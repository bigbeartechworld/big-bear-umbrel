version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thunderbird_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/thunderbird:1140.16.0@sha256:5d0ad6fe32c9b72b6eb42a049a1f76d8445612f2ad355937ea23295d8cde06ae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
