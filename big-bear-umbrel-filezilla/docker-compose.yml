version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-filezilla_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/filezilla:3.69.6@sha256:5fd56fe75c3bd14b111c42a7286e954381aac9b485b097aae2e0d1d19eb89e68
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
