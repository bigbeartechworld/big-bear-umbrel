version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-filezilla_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/filezilla:3.69.6@sha256:dafcfbccf25ce88af5d29bf3bbb3bfbf1f5dc6ef5ef0863b7427ca01511c79fe
    restart: unless-stopped
