version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-skysend_skysend_1
      APP_PORT: "3000"
  skysend:
    image: skyfay/skysend:v3.1.0@sha256:12ec06476a2a55e8ae5f71f760d9a98546e1b60f99d93a9a2b9c977a62ae69c9
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
