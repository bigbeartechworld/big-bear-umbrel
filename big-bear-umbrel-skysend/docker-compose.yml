version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-skysend_skysend_1
      APP_PORT: "3000"
  skysend:
    image: skyfay/skysend:v2.12.2@sha256:64fcc07d2dfedb15efa72badc538c452c9e889125bdd9f1e35347f14de108cc0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
