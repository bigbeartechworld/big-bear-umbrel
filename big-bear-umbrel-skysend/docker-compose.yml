version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-skysend_skysend_1
      APP_PORT: "3000"
  skysend:
    image: skyfay/skysend:v3.0.1@sha256:aa38fb1213fb564037b728c6a8a5d619a3223dfd3006509b79058384fe76d6fa
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
