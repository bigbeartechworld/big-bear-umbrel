version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-telegram_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/telegram:7.2.9@sha256:5394e30aa1dc45da74288c3c5d11247a8bc3c66137bb130073a6778fbba0062d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
