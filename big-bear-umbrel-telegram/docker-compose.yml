version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-telegram_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/telegram:7.2.9@sha256:95001d2147cddfe31b4fd74e24f5c0188c79178b541487f99596b9c7d2787748
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
