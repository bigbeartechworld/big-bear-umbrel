version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-telegram_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/telegram:7.2.8@sha256:625bb3d20c1db2bc0a57e7e9d2ded64827756a47fd6b551c62503160045d6ab1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
