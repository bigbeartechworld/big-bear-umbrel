version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-privatebin_app_1
      APP_PORT: ' 8080'
  app:
    image: privatebin/nginx-fpm-alpine:2.0.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /srv/data
      - type: bind
        source: ${APP_DATA_DIR}/config
        target: /srv/cfg
