version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-librewolf_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/librewolf:158.0.1@sha256:9503a95a4216b96b44483a458910de9b65708ae92bbeef0205f4d88ee1a9cdce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
