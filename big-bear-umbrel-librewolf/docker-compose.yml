version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-librewolf_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/librewolf:157.0.1@sha256:489a151de407f01f0e5086166da313872aeec67e78ad096d793641531a061511
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
