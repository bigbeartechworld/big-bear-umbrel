version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-librewolf_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/librewolf:155.0.1@sha256:84205cecdcdd3c5db38206df705c32c663c64bfffc7b84efb457f98b4519b296
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
