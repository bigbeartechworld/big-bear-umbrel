version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ffmpeg_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ffmpeg:9.0.2@sha256:abb675ffda7047f42dfba02adcd0886b3abfca6dec332adc4da831de943989ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
