version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ffmpeg_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ffmpeg:9.0.2@sha256:f4191c1abe18d75c49a23f7224d1403d55334f80013a47cb096f5056cf19617b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
