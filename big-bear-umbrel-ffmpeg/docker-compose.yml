version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ffmpeg_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ffmpeg:9.0.2@sha256:6547359fac23a2747e606d380e10267b2923a38f68485d9cacefd039e74d3aa8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
