version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ffmpeg_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/ffmpeg:8.1.2@sha256:2e7000921be8de2704a4f27dfd3d988562697a346eaabb937a81046c306f0af7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
