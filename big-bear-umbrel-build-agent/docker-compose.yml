version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-build-agent_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/build-agent:version-0296acb5@sha256:63e38c87cfb1d73beff12975706ffee41c7bb42db41c305648871df98cc24ec0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/build-agent/config
        target: /config
