version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-modrinth_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/modrinth:0.22.0@sha256:bcdc1cf7319c190ab75c17b5d02612bb02fadd70b908356202bd58a5da0cdc3a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
