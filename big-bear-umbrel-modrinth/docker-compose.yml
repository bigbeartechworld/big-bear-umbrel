version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-modrinth_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/modrinth:0.21.6@sha256:16ad845643755e2fbde08fc95336478aca085481a0232181b37d87374d32b985
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
