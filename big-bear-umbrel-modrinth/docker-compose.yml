version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-modrinth_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/modrinth:0.21.5@sha256:e58ca416ceae9ac31f2fab100ac3857fe9d2066fc07dcb8dc6af7240890e5ba0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
