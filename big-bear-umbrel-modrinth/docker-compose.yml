version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-modrinth_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/modrinth:0.21.10@sha256:8d9e5b261f3973ded4264610db8c1bf582a66c8bd4994b9086e21793f576615f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
