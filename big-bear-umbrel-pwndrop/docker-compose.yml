version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pwndrop_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:03d921e0ef70389f22ab74b32ccbd30017bfc9a536bca52f4d7bf8b6a4a63d92
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
