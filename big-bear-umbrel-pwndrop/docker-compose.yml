version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pwndrop_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:2e5428b3c612d0b8413e584539f444b59ddc388d31d71bb5cc6fd348286a5904
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
