version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pwndrop_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:988739a36fac0a7264a3245ffe78c7c9277a575f204227997f1b82f32351ecd0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
