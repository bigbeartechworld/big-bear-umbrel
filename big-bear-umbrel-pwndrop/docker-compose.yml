version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pwndrop_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:d762bb7bac0aed541db69e5c10d2e7ed3cb35c16b944320aa89dbfbe211179af
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
