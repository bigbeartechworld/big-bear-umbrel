version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-habridge_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/habridge:5.4.1@sha256:112fc3f5e6f223683301c4a8e638be70a64559fe1f08b3af4248487646651f21
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SEC_KEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
