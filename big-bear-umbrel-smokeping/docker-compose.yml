version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-smokeping_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/smokeping:2.9.0@sha256:b38cae89eb9d2ac49858533b723ea514eb0501f50d179c715d89e5e7214950da
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
