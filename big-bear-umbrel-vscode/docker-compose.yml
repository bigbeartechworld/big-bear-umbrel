version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vscode_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vscode:1.137.0@sha256:f7a5c7f1d8462219ad30f4d7a2ae821a305d298f53402d054af7ed03d718c69f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
