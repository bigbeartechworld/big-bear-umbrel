version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-azahar_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/azahar:12126.1.2@sha256:31508bb1f84718378b2a48789f3bea015fc758043d4a557bdd517b0bee1a596f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/azahar/config
        target: /config
