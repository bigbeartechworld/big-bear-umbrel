version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-azahar_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/azahar:12126.1.2@sha256:d42456be1352112b447972c97b145777fbc119d580f2612275d16e03172086d5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/azahar/config
        target: /config
