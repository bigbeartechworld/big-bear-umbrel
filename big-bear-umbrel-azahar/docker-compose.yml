version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-azahar_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/azahar:12125.1.3@sha256:4bc384663b37a8156ead374a3dde70a69b913e8fd791ab02e0951c6e1f1a979e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/azahar/config
        target: /config
