version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wireshark_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/wireshark:4.6.6@sha256:f685e7d714a1423d4bc55cb6761c1c384b1ca08227ba8d0e89030725c70f5e34
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
