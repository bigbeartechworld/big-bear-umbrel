version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wireshark_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/wireshark:4.6.6@sha256:33647c4718f21746cedd9d791e4ba9e491706435524471c6894c96a4a1018fab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
