version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wireshark_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/wireshark:4.6.6@sha256:71f1ff10deb77110eedb651f1ec1ddd929793d371cf6550732a3f1c43ff86010
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
