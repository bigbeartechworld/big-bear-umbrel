version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wireshark_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/wireshark:4.6.6@sha256:9b334d73088a13b822fb81a4e6805106692efe2d23401a57cd190b50935f1899
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
