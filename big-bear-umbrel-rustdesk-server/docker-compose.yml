version: "3.7"
services:
  hbbs:
    image: rustdesk/rustdesk-server:1
    command: hbbs
    volumes:
      - /DATA/AppData/rustdesk/data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:1
    command: hbbr
    volumes:
      - /DATA/AppData/rustdesk/data:/root
    network_mode: host
    restart: unless-stopped
