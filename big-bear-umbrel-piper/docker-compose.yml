version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-piper_app_1
      APP_PORT: ' 10200'
  app:
    image: linuxserver/piper:2.5.2@sha256:26fc4838f1d693c21e24b011163555b86d2ec0d162d31efed8366501fcf86544
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PIPER_VOICE: ''
      LOCAL_ONLY: ''
      PIPER_LENGTH: ''
      PIPER_NOISE: ''
      PIPER_NOISEW: ''
      PIPER_SPEAKER: ''
      NO_STREAMING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/piper/config
        target: /config
