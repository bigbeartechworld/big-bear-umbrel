version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-sqlitebrowser_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/sqlitebrowser:18.04.1@sha256:03f747bdf1f035d0752693cb0ff415a508badaf0de28bfe7a1765009c51ed6ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/sqlitebrowser/config
        target: /config
