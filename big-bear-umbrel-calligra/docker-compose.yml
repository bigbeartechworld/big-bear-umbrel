version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calligra_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/calligra:3.2.1@sha256:f959985c5f8480d6e03ce6264eebdff7bf64a825891fc96b80df0410b95d5f1f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
