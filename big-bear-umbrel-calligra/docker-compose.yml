version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calligra_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/calligra:3.2.1@sha256:c1251088057743be3c8ff5c78b02c225db12e792b4bff81ab532143e989907ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
