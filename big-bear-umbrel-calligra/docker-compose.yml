version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calligra_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/calligra:3.2.1@sha256:7667e2f4b9d1ada53c510e05db59ab2233ac4b976476eadbdd4fb58ab19f245c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
