version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-calligra_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/calligra:3.2.1@sha256:e78dbca86e4381bc9cc4ef5835d02915e944ce77fd7ae58cb2bbf6a3c42ed003
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
