version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-syslog-ng_app_1
      APP_PORT: ' 514'
  app:
    image: linuxserver/syslog-ng:4.11.0@sha256:ebca4415977e0b3120b45fe203538e54b1f82cf49942fdc72d78786fd587331c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/syslog-ng/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
