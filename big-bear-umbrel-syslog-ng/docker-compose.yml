version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-syslog-ng_app_1
      APP_PORT: ' 514'
  app:
    image: linuxserver/syslog-ng:4.11.0@sha256:3ac726bdd58cf979ab9e97ea37f6c56d7acf1d23586f5f3b29c8834b4f9bf547
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/syslog-ng/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
