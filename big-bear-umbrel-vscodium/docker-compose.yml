version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vscodium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vscodium:1.140.06880@sha256:e5d0badb7b86b2c47e96e5a69d0589f2972479c5202536d98f52b2ff5634b720
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
