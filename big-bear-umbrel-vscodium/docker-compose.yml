version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vscodium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vscodium:1.135.06055@sha256:3a7e2ab355c744bcac49457fa01e184e35336eccdcf6192538a4b4d7c611c730
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
