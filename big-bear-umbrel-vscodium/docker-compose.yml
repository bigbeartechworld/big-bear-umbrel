version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vscodium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vscodium:1.143.17183@sha256:78212cf7c9fffb53177129c37ea1f5173744a01ce5d59fa7a73e1d792913f7e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
