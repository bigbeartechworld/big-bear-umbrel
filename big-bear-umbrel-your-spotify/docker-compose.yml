version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-your-spotify_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/your_spotify:1.20.0@sha256:ecc392c13258df4bd403d09c33be896d3883e31a68241c211a45f20a484931a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
