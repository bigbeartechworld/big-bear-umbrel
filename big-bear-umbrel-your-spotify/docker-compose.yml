version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-your-spotify_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/your_spotify:1.20.0@sha256:3eeba4189eb6a0f5926d7f5ff0b26098fca719a38d6fc1789e6add0f3d15feb6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
