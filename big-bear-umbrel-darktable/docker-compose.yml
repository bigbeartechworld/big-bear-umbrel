version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-darktable_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/darktable:25.6.2@sha256:35535cd2b8787253981c0946bcde3d6126006ad2475c243982eacfdfecc19ec6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/darktable/config
        target: /config
