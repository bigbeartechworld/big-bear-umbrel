version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mysql-workbench_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:05f55c6f18e9ce0ed399d55adbad87482b26f89f76f93d2288ab24ee26bbd95a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
