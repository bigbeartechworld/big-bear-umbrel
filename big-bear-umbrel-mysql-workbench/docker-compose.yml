version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mysql-workbench_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:280372c734cb9fc0ce5eeebff04fb70f7374ed69b1e580b3b3eab6242520be18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
