version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mysql-workbench_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:71e59c22815a5b7cce5817db74b717dfc8c4bd0b7d360e540a6dfc16a422a6c4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
