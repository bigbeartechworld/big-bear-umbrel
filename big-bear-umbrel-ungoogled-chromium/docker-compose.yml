version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ungoogled-chromium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ungoogled-chromium:156.0.8078@sha256:0aef995ae73843b0d70d876e3dc86505902558b715432b34037830b8e4c19c3b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
