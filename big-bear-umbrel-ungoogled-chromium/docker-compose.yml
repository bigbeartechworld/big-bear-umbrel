version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ungoogled-chromium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ungoogled-chromium:154.0.8037@sha256:e347d80186a57a1c6d735e58d4df9ab382042537923bcae6aee073b283a2645a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
