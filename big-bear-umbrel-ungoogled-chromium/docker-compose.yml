version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ungoogled-chromium_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ungoogled-chromium:155.0.8059@sha256:6a8446ff5728b32212e412d46c0981ac10b276c4a97222fa12d07352654ada28
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
