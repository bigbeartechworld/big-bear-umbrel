version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-opera_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/opera:136.0.6008@sha256:aaadbb58c44d3893732b7a3d107d8473637fd3a2cb2771c83513c759bcbe9cfd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
