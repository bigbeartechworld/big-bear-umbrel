version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-opera_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/opera:139.0.6053@sha256:ef50f6482655e20209ae98f9345a33ccc65ac5268f389e2f5fbeea7afb5b7d88
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
