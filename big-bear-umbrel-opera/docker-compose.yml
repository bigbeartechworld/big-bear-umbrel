version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-opera_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/opera:137.0.6036@sha256:bfa40165868ece5aa623ff8f17356004d6c5854a38fbc26bb49182f64db62505
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
