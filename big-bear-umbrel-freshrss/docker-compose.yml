version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-freshrss_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/freshrss:1.30.1@sha256:bd13d4a611959bad42bd79965d3202c518494bd775be4a0f61e4b81098b18b01
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
