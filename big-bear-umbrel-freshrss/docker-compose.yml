version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-freshrss_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/freshrss:1.30.2@sha256:f6418c990d37533223fa3fa3ce048edae021a8fd3aac6c46296a03c4c3249bf4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
