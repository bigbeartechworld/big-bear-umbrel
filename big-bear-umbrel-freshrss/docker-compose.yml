version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-freshrss_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/freshrss:1.30.1@sha256:d5a11c52ba6987702e899c2c3831946eb959b54af34db96b1fe41194286acfb2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
