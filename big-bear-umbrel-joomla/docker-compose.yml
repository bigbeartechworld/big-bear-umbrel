version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-joomla_app_1
      APP_PORT: ' 80'
  app:
    image: joomla:6.1.3-apache
    environment:
      JOOMLA_DB_HOST: joomladb
      JOOMLA_DB_PASSWORD: 15311349-803b-40a2-9153-5b13f8d4022e
    depends_on:
      - joomladb
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/www
        target: /var/www/html
  joomladb:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 15311349-803b-40a2-9153-5b13f8d4022e
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/mysql
        target: /var/lib/mysql
