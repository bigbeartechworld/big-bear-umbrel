version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mstream_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/mstream:6.28.1@sha256:0938777fbe4a1884aa7a24e8c203c39c22c8fc1a631c4330427725a8dae17e86
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
