version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-krita_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/krita:5.3.4@sha256:cb370716097e8648755c27a48fb5783c59ee9579f48c6dce9b412779593ff95a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
