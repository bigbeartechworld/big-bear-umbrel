version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-krita_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/krita:5.3.4@sha256:5c185684d783c091e558c197c74df39c1898516afec1eb12620503f841deeb61
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
