version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rustdesk_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/rustdesk:1.5.0@sha256:f7fd6d7dfa2e92dc98153e70c881443d5ab963acc6ed1dd2571dcf7593f63dc3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
