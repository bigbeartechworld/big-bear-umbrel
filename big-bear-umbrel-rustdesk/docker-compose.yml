version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rustdesk_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/rustdesk:1.4.9@sha256:926d824ca732a1ce33b87390f9a1d745ec7f9bf1d79dcbca47b663d1f3be4e73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
