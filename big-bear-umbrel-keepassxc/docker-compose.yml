version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-keepassxc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:d90c6897af7d11bc6f669e6a3ecee5a15a7e623d8a9d62411dbb83198ccf4081
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
