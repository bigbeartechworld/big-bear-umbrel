version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-keepassxc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:1e3620de7342a7368a9820a17a29edfe51bc6381efc2ec5091fe5deb429575b9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
