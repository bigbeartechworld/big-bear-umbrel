version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-keepassxc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:3e559db94c85c7a5566e4f470345e347bc05b563844b0fc9185c7ecd5d219123
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
