version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-keepassxc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:267bc745b3cdd3d05276ad62c8e039031eec0c5d2323b3fb2f5f6df32110efdb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
