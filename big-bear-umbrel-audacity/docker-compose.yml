version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-audacity_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/audacity:4.0.0@sha256:f372d378bef84eee5fd709f612da66be7647223f7954f100771b64823910ca71
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
