version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-limnoria_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/limnoria:2026.5.8@sha256:d3de58e50fda7a70ee6b3521299e415f609260370ca09f5f083681239917944e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
