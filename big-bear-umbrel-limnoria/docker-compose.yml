version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-limnoria_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/limnoria:2026.5.8@sha256:72171932a19ce8adb7efb7b9f963a4418da745e1bd54533f64f39d93f9aefc18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
