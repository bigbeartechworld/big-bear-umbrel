version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-tautulli_app_1
      APP_PORT: ' 8181'
  app:
    image: linuxserver/tautulli:2.18.2@sha256:c6a48416d16b26f254b000133d2d844c1905ee58ed0f44aad9bda66598d39988
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/tautulli/config
        target: /config
