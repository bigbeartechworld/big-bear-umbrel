# Configuration for ollama-amd setup
# Name of the big-bear-ollama-amd application
version: "3.7"
# Service definitions for the big-bear-ollama-amd application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ollama-amd_big-bear-ollama-amd_1
      APP_PORT: "11434"
  # Service name: big-bear-ollama-amd
  # The `big-bear-ollama-amd` service definition
  big-bear-ollama-amd:
    # Image to be used for the container
    image: ollama/ollama:0.40.1-rocm@sha256:675915e5aaae3170902129a4a4df8843b1d8ae02313a7e8ff6231164265c5ed0
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PORT=11434
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/.ollama:/root/.ollama
    devices:
      # Attach GPU
      - /dev/kfd
      - /dev/dri
