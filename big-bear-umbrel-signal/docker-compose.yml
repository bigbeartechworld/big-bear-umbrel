version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-signal_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/signal:8.32.0@sha256:58c849cc640538398e8681973b65a0c6a707fb6ccf624fbd3f9b361f0ca8e72c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
