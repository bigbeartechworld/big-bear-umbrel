version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ardour_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ardour:version-2026-06-19@sha256:720a44efc9e158e56fd1f12e00f190746f73bcf1fa20aa508c8e9c59f27dc423
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ardour/config
        target: /config
