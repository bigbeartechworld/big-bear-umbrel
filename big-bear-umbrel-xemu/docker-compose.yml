version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-xemu_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/xemu:0.8.134@sha256:6904497c2cc7660e5e356e00a22aed842046584be1771ae0639a8c6a669de4a3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
