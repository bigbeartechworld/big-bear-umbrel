version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-xemu_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/xemu:0.8.134@sha256:9ef505ebf120e427deab5bf5da2d7e91616ae9da7fc0dc09bc741a01dea1e732
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
