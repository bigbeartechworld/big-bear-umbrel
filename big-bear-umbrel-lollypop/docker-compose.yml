version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lollypop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/lollypop:1.4.45@sha256:2ba2b291113664029c6aec0383723f4a7ef19f22c28f77ce1bcb0acb31c7d6d8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
