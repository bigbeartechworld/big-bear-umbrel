version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lollypop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/lollypop:1.4.45@sha256:d0b4550a8646313e67dd023e3e411b9bc9a0709933d3c92dfd2e2c7f11764b71
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
