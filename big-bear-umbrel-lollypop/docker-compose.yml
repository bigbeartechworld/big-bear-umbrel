version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lollypop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/lollypop:1.4.45@sha256:2237b0a1e9a81009b5f1b8838781b77c1fce172e6d71a0db2a9a215c64e2b755
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
