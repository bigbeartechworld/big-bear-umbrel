version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lollypop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/lollypop:1.4.45@sha256:aa525497087ade779351992433c6a6277ede4cdb20076ddbe42a077a63126bbf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
