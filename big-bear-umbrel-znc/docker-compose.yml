version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-znc_app_1
      APP_PORT: ' 6501'
  app:
    image: linuxserver/znc:1.10.3@sha256:f5187fab44a3c2cb4ece27030f4857a14d2b06a5ca739bd1d5973f2914dee6bf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
