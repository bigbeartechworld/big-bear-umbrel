version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-znc_app_1
      APP_PORT: ' 6501'
  app:
    image: linuxserver/znc:1.10.3@sha256:51e139085d594ca3b90c415ef081fee2a394387668acb54d32cc9c2852a33823
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
