version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-znc_app_1
      APP_PORT: ' 6501'
  app:
    image: linuxserver/znc:1.10.3@sha256:1ea1c89129a36d0a2a2beeec3bb896ff4b9be5f261e23c623aa8ee9974e1086b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
