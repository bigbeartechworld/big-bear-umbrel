version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vivaldi_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:99c17c22b65023358730ce4cfe25c2df71c82de6431ecd163962957cd6ca7a62
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
