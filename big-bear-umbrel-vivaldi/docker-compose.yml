version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vivaldi_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:66a85c75cb9709dde788b31ea2d64d48af052afb8cca28c5c4bd32bb5d845a59
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
