version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-cura_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/cura:5.13.0@sha256:3fe57aa9d2046783aa3167fc6c7b72b1edc01d888351c85523db70db353f0c50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
