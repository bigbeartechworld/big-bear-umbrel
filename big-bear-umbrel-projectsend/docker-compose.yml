version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-projectsend_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/projectsend:version-r2098@sha256:c98b4e981529c66a9a1065dc6f1666de961e400c7d25c23ac1588086c68c1119
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
