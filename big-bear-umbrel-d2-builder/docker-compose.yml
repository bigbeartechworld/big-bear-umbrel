version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-d2-builder_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/d2-builder:0.9.0@sha256:7f1a533650c6edb3a135fc54abda14384c0d4475b4e67e17a29d532d6620f03b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
