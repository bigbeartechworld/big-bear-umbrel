version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-d2-builder_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/d2-builder:0.9.0@sha256:a6a6c3f337c0801b29bd8897bca9da75d1c9ac716929628546eafb571558a256
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
