version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-d2-builder_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/d2-builder:0.9.0@sha256:990e2a8c29d49a049eda00b1cf7d4f81a33ef3497b49c9285f2699911450f508
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
