version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-d2-builder_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/d2-builder:0.9.0@sha256:f2a3c7f4f14050bc50665d240b2bbab49b037dbc0fe63b46385287674dcff662
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
