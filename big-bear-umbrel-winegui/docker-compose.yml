version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-winegui_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/winegui:4.5.1@sha256:e5fa5df6f9e566c7be2548ea9e547bcc5a41dc97fe7d31cdee6de107935a7ce8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
