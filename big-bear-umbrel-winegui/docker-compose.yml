version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-winegui_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/winegui:4.5.1@sha256:59ec652acc8f5d4aab7308ee7d3d30bd68858d11264d9e54e0d526584232421a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
