version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-libreoffice_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/libreoffice:25.8.7@sha256:fdc5d5d232b265d1b920e61c1b87892ca0e2b1f96a3e74fbe42f03a018e16a5f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
