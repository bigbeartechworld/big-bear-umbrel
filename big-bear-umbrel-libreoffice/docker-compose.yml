version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-libreoffice_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/libreoffice:25.8.7@sha256:cf7f029fd003d6111afeb27be62fd6c869de79d417531d9e90a77ff647730b02
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
