version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-podfetch_app_1
      APP_PORT: "8000"
  app:
    image: samuel19982/podfetch:v5.2.3@sha256:a9705ffb906c020740b1e1aae4b38a0ea966d7190d47ee7956b4d573a48c16f9
    volumes:
      - ${APP_DATA_DIR}/podfetch/podcasts:/app/podcasts
      - ${APP_DATA_DIR}/podfetch/db:/app/db
    environment:
      - DATABASE_URL=sqlite:///app/db/podcast.db
      - POLLING_INTERVAL=300
      - BASIC_AUTH=false
      - USERNAME=bigbear
      - PASSWORD=15c40698-3cd9-40ce-8039-e8d80fc1a030
      - GPODDER_INTEGRATION_ENABLED=false
    restart: unless-stopped
    networks:
      - podfetch-network
      - default
networks:
  podfetch-network:
    driver: bridge
