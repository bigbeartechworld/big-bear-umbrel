# Configuration for node-red setup
# Application Name
version: "3.7"
# Services used in the application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-node-red_app_1
      APP_PORT: "1880"
  # The `app` service for the node-red application
  app:
    # Docker image to be used
    image: nodered/node-red:5.0.9@sha256:2ccd38b4066648bd5e17430c50a2f8102c566a82fd4f2fc5c342e61664d6896f
    # Restart policy for the service
    restart: unless-stopped
    # Volumes for the service HOST -> CONTAINER
    volumes:
      - ${APP_DATA_DIR}/data:/data
