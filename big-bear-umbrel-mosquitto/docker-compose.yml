version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mosquitto_app_1
      APP_PORT: ' 1883'
  app:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/config
        target: /mosquitto/config
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /mosquitto/data
      - type: bind
        source: ${APP_DATA_DIR}/log
        target: /mosquitto/log
