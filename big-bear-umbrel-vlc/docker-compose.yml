version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vlc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vlc:3.0.24@sha256:47fa90ac456cc9485e28ec7bccbedc56cedaab87853237461374c12fb91c588c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
