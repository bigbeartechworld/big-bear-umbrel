version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vlc_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/vlc:3.0.24@sha256:102c3ac0ac13a4a8252ab4c1d7b6d7faf52af0f193a54f5f7ddd8c131e798c83
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
