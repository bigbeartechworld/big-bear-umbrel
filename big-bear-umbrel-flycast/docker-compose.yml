version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-flycast_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/flycast:2.7.20261018@sha256:111a34293a74da4d21b81baa4cf95fa8c0ea9e2464aa93cfa61a60bdffdee5ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
