version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-foldingathome_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:ebb32940e4bba0910efaf13dcb4aadc6da9281e81012e6644641c9042ffeb3a1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
