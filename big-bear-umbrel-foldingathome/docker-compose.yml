version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-foldingathome_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:6245b3f602f8a3b95653d640d24342eed40234d0723d260d8fc3bedd55d00fc6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
