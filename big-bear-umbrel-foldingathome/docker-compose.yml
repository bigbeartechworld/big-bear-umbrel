version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-foldingathome_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:6d16e2e1460e43e84d3e48ba956aee4aa826435233ad3e8c6c3526f3e6f20bd8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
