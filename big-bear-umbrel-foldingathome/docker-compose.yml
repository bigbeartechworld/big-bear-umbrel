version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-foldingathome_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:abfd81b80fde1d8f659c201bfaa2c21648e9dc7f42468a700c82e0215ba763ab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
