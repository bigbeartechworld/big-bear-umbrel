version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-inkscape_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/inkscape:1.4.2@sha256:a33e7cbd9c8039b11f681d87bc07e9916e73c4bb245fa5df16fd227afdb8cb86
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
