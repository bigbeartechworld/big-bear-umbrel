version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-inkscape_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/inkscape:1.4.2@sha256:5f9b8b052072ec001296d1d555039da2667cc1b0fd91f14ae912f23b69a56a56
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
