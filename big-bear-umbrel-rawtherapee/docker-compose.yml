version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rawtherapee_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/rawtherapee:5.13.20261018@sha256:b6c861028327deed81c1ac5699991252aaa530c82da6b9f547ed7daee65f31cf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
