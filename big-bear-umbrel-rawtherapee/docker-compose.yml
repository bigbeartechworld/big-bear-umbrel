version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rawtherapee_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/rawtherapee:5.13.20261025@sha256:6b2e857e1f273426a01146640c973be698ca9dd7088f61b3d54fe04fdb822d56
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
