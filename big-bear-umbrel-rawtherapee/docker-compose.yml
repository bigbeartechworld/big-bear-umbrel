version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rawtherapee_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/rawtherapee:5.13.20261011@sha256:48febebce9f7bb82a7af5dbe96094edcf6128e9be76619e4d51d6ddf65fff70b
    restart: unless-stopped
