version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-openshot_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/openshot:4.0.1@sha256:5332b8911c60341a8db307dedfe7ab8b46cdf4dd17166c9f233693fc123c8ab7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
