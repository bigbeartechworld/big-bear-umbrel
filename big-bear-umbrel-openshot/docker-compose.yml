version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-openshot_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/openshot:4.0.0@sha256:64c44b097911fd11cd95d61653a9d3b87d1f679449afdf2e7954949a83bcb2dc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
