version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-eden_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/eden:0.2.1@sha256:e027a282a2357980702e8ba72e865671f187b77da816ffe718b768aa7c289252
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
