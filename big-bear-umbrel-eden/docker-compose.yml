version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-eden_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/eden:0.2.1@sha256:934072cb6050caeb9f2fd1b76ddfb9861e6d5065924836dd67641103e3bb1cac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
