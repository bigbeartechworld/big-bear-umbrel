version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-eden_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/eden:0.2.1@sha256:cf7267aaa8aeafcd67bfa107a966e5fe7eeed88022fc551a975cfda1cab6ded4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
