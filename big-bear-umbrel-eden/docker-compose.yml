version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-eden_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/eden:0.2.1@sha256:c149ae02c0cd47f10c940442912d64c719bc724fda9d59c91077e10869a8ad3e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
