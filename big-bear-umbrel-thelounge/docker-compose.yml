version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thelounge_app_1
      APP_PORT: ' 9000'
  app:
    image: linuxserver/thelounge:4.5.2@sha256:552981ad86026e1f5fde3e378a7c8ffee653794b1333a791a23a74f2d54e31fc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
