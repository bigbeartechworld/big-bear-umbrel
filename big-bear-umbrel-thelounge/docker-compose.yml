version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-thelounge_app_1
      APP_PORT: ' 9000'
  app:
    image: linuxserver/thelounge:4.5.2@sha256:af421a8254f9d1228cfa96af6bdf63a8c8306dd17d017757c16c3c0a126385c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
