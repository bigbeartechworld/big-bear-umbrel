version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wps-office_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/wps-office:11.1.0@sha256:f2f8d2f4028d9cf6b4f7532b8e04ff65502d7d02d85f13d09b2eeaefa093fe0f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
