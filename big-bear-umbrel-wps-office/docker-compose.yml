version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wps-office_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/wps-office:11.1.0@sha256:3c1e8dc06b08b5f25fd205c50b4c057070e2e1fd2e127532f540cc84f8f350bd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
