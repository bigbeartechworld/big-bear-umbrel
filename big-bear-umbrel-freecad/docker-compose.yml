version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-freecad_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/freecad:1.1.4@sha256:79e4344533aa28a03799cb1a36376f17ffee98c78890ef78d8297908eed301e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
