version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-freecad_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/freecad:1.1.4@sha256:a2687a6e8b6dec94832aa4c6e4134aa01ccc3ad80588fd2005c3faba03829bb3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
