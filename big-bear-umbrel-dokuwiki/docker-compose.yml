version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-dokuwiki_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:23ff93932dac6e6cad553795b50883d7f9ba906a0a58d77d26bbd85306371939
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
