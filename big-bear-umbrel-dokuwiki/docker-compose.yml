version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-dokuwiki_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:c2d3125e994e9d508f39af4ee04caf4ee07a47149305974d3275febd3b81a45d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
