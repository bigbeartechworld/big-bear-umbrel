version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-dokuwiki_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:0cc41bd66066966db447bb2728880ceec12637fb9c14ff0a0faa0b7caba4294e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
