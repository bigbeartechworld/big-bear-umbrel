version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-handbrake_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/handbrake:1.11.2@sha256:336dada61d7b69abc183443e7ab65d412c78ca14af907f2fb1ab9cf3b6b01940
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
