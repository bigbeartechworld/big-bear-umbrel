version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-handbrake_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/handbrake:1.11.2@sha256:58c17f7f8b37d6cdb11ac269d927c953f0fb13cbc918372bceaa597a33d5e221
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
