version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-bambustudio_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/bambustudio:02.08.04@sha256:857e937fe1c3451244cb178952e0e7a00241ab48c32cb1ce9ea6b27e4fd729e5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
