version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-bambustudio_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/bambustudio:02.08.04@sha256:81f70ad79762348d948a32ee50a593392a86b38ce3742d47936e5f43d4b82602
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
