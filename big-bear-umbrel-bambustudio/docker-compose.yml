version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-bambustudio_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/bambustudio:02.08.02@sha256:7f31ec3fecb07338eb391674f4a4436fed4c5ceab238e5bbc31c330cbf4196ff
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
