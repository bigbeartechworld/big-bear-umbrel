version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-diskover_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/diskover:2.3.5@sha256:d5ec52af88b3786365fb85d4a7dd8f8cacc7a468d361543bcb8e5e2c24c5f408
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
