version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-diskover_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/diskover:2.3.5@sha256:6db9a9410ea4c1af9b62826f4cd80a496be48acf9bb355649d2deceecb0c342a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
