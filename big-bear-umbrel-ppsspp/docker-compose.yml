version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ppsspp_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:606f11c4694ef0c85e5d33d3f77e8101c071d8c2fc2506838ba8f68362986a8d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
