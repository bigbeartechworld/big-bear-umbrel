version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ppsspp_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:f3a12c830e6ef504f0e7dd1b8f47ea50c43430647e2946a7f02d028a5baf4985
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
