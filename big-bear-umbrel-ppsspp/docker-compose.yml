version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-ppsspp_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:a237f0248e5f20eb5d9f459bc9d88e354ad956779361cb21605fc5375a45bf65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
