version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-bitcoin-knots_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/bitcoin-knots:version-29.4.knots20260508.1-noble1@sha256:c5f17ac3492af411bf83e2a62c1640be1b53b551570d3d39876c1b18bec82879
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/bitcoin-knots/config
        target: /config
