version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kometa_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/kometa:2.5.0@sha256:285c4e5aa244fe2497efeda4bbedbb54e4e6a75e5c557fa0c6bb9373dce0f23e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      KOMETA_CONFIG: ''
      KOMETA_TIMES: ''
      KOMETA_RUN: ''
      KOMETA_TESTS: ''
      KOMETA_NO_MISSING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kometa/config
        target: /config
