version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-scummvm_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/scummvm:2026.4.0@sha256:4a03c7f05c56a3fbdbec49557f3f17becd7d5a7d770710aa6b59b8654909f59d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
