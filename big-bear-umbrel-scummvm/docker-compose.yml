version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-scummvm_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/scummvm:2026.4.0@sha256:74afd22ac0eea7978accb221420cbaf8f74d951c6f4efc20264da0491f5ca33d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
