version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-budge_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/budge:0.0.9@sha256:579915d33cdab28b23ebb2f08cf9d8272fb0bd6302c383206dbf71fd89047fc3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
