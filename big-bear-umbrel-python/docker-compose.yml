version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-python_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/python:3.15.0@sha256:cefdc592b20898169ddceda2bf9dbed936899def8790e1daaa684197cf9fd4a4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
