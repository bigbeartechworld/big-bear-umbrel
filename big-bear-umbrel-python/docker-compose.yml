version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-python_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/python:3.15.1@sha256:f3f0f364d2a301441e6a8c304a1178cab0cabe975322044ba7c07314f9ed0c9e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
