version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-python_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/python:3.15.2@sha256:6c526db6ad81da8cea25cfeddd50051c2a9970a67d96fadc308c217a7e2d5d51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
