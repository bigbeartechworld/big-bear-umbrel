version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-unrar_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/unrar:7.2.7@sha256:48c0ce2609bb3c35764956bbd9395e95b177421e3c74b3628c3676029f24f2e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/unrar/config
        target: /config
