version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-embystat_app_1
      APP_PORT: ' 6555'
  app:
    image: linuxserver/embystat:0.2.0@sha256:adc479353fc0b810c21935a8fe3c2d20d9f7027edc9574477d702ec2ad414754
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/embystat/config
        target: /config
