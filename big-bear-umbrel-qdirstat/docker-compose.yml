version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-qdirstat_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/qdirstat:2.0.20261018@sha256:3c9c3f6b1ecb173d4cbcd25bf8b87cb9fe8c1d4e6a480554afe54f43158925db
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
