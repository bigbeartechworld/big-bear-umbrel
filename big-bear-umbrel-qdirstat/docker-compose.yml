version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-qdirstat_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/qdirstat:2.0.20261025@sha256:7909da908ad98d0f4fe807b28cee1cf07ddbc375980ce7907165e146f1d85415
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
