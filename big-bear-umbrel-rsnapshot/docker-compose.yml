version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rsnapshot_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:5afbec6c331cda21ed0db3e625caa7f23527f28b062f2b6dce3a7750f6d2cf97
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
