version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rsnapshot_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:92547730d7276ec5b2748bdc3f26bad6b05ba7c6413da41bf865fb931d30c2f9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
