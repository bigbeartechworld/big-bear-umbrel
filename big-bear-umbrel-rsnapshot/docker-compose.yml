version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rsnapshot_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:9f2b9c875d9b970f0078d81eec17c27b8428201c0f9defc70360c19d43ccb658
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
