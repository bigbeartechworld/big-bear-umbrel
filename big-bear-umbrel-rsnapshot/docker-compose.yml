version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-rsnapshot_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:3662cff04ae2d7375be2468642f6612266cc44bdc6755fe533f50441581adb87
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
