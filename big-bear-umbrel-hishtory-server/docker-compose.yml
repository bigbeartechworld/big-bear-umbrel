version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-hishtory-server_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/hishtory-server:0.335.20261016@sha256:5cbf3c91579b4fe0fd1ae347e5855301972692d4de6a7231942315b76fe05617
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
