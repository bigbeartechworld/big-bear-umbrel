version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-hishtory-server_app_1
      APP_PORT: ' 8080'
  app:
    image: linuxserver/hishtory-server:0.335.20260925@sha256:4acaa42e2501ec386037162261bbf68455dfe753644b6ed6801cf284de91e6ae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
