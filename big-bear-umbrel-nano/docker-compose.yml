version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-nano_app_1
      APP_PORT: ' 8075'
  app:
    image: linuxserver/nano:21.2.20220522@sha256:abba1dc5b14d99b1996a52b51d51f9247deea6f2c540d030c02060ea46491843
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PEER_HOST: ''
      LIVE_GENESIS_PUB: ''
      LIVE_GENESIS_ACCOUNT: ''
      LIVE_GENESIS_WORK: ''
      LIVE_GENESIS_SIG: ''
      CLI_OPTIONS: ''
      LMDB_BOOTSTRAP_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/nano/config
        target: /config
