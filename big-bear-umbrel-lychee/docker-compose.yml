version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lychee_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/lychee:7.11.1@sha256:f51f948e32292de2f3d66839eb17501602112c882f0105007fc82dd557a1c075
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_CONNECTION: $DB_CONNECTION
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      DB_DATABASE: $DB_DATABASE
      APP_NAME: $APP_NAME
      APP_URL: $APP_URL
      TRUSTED_PROXIES: $TRUSTED_PROXIES
    volumes:
      - type: bind
        source: /DATA/AppData/lychee/config
        target: /config
      - type: bind
        source: /DATA/AppData/lychee/pictures
        target: /pictures
