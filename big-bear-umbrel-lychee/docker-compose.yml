version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-lychee_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/lychee:7.9.0@sha256:e87c0f18d9de9a9cce45d8f2abac4d5c083030a596ea23987cf9ad9823b8409d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_CONNECTION: $DB_CONNECTION
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      DB_DATABASE: $DB_DATABASE
      APP_NAME: $APP_NAME
      APP_URL: $APP_URL
      TRUSTED_PROXIES: $TRUSTED_PROXIES
    volumes:
      - type: bind
        source: /DATA/AppData/lychee/config
        target: /config
      - type: bind
        source: /DATA/AppData/lychee/pictures
        target: /pictures
