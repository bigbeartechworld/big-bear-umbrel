version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-sealskin_app_1
      APP_PORT: ' 8443'
  app:
    image: linuxserver/sealskin:0.4.0@sha256:715433f44c6265b4402061e0dd6767610accb7c44b2c6ce91ec8fc77e392283a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
