version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-sealskin_app_1
      APP_PORT: ' 8443'
  app:
    image: linuxserver/sealskin:0.3.2@sha256:f3bb5d844a65a8815586ff9822a69a1d84ede54e53bc209ba11b50577d9caaa4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
