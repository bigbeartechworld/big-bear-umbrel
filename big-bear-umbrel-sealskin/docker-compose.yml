version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-sealskin_app_1
      APP_PORT: ' 8443'
  app:
    image: linuxserver/sealskin:0.4.0@sha256:888dc5097fd74b445ff99c6d6c0c9d7c64b817554d855250b59dfcb2669eac30
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
