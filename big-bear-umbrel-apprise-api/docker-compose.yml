version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-apprise-api_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/apprise-api:2.0.1@sha256:110422ebb81151b6cfe1810ccb7529f353d9fa0fad7b9286fe59b67907a08368
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
