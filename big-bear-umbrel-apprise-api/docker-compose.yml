version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-apprise-api_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/apprise-api:1.5.4@sha256:9a0d15b11aa1e9979ff05ba21abfd8b5d586d73d4b2d0c81fa406f8b1b39aaee
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
