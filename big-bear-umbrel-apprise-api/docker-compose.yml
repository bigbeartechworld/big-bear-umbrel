version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-apprise-api_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/apprise-api:2.0.1@sha256:742580f9c5e8e94e8009be3406bd557c012457d00acde7684066b3f897753d52
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
