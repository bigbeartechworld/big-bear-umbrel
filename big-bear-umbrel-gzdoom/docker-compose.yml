version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-gzdoom_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:dc74ced86ff8625f16c95875b6d4db4efee64789b1a5a4fe7c145ca05b0d7b14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
