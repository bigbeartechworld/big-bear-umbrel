version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-gzdoom_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:b450a1f6bda7bc89396dde264d43dd144c48c5abf670d40f0e94d65b4e56dcfd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
