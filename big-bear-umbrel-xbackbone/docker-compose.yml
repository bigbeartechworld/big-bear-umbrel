version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-xbackbone_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:ec54014f6801afa103c675cb81d6df6a1d63e5de7b6cc48e98c05ec9cf6aea82
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
