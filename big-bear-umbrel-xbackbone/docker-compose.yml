version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-xbackbone_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:c38a46cfd7d211272d63a7623f9e94845746b2727e2cfb3e97c235a07830d712
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
