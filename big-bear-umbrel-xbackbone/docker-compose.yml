version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-xbackbone_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:8e9f6abd2355d80d4faafccba05b9cbee4e2a522d8b462a0ec589232cf4fb210
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
