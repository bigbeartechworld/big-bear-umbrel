version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yaak_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/yaak:2026.9.0@sha256:baedb709835196606a4c9669e432f8d6f92732b4d6433fda445dad7f9c60c337
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
