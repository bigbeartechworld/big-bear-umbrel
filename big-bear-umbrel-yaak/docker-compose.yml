version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yaak_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/yaak:2026.9.0@sha256:fc83e838f56dfc15a5ed59192568d502c8bc48a7d81e6b2eea0ae489eed8e364
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
