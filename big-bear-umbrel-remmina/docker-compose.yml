version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-remmina_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/remmina:1.4.43@sha256:bf0f63faa3534ac55c1a5bcb76968f3c967e0ce573eec3e6b70955e08ae9b08e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
