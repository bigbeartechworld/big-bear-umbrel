version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-remmina_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/remmina:1.4.43@sha256:46d855c0eabe231edeaec9b138514e484d4b19f412dc4ae90076ca2d488d98b3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
