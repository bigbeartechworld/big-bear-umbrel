# Configuration for big-bear-mind setup
version: "3.7"
# Service definitions for the big-bear-mind application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-mind_app_1
      APP_PORT: "8080"
  app:
    image: "mrcas/mind:v1.5.0@sha256:7286c26022a7dc85faed61fe49663701c244caf5eabb0245ffed236aa7ed8b61"
    environment:
      - TZ=UTC
    volumes:
      - ${APP_DATA_DIR}/db:/app/db
