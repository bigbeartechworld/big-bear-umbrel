version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-vscodium-web_app_1
      APP_PORT: ' 8000'
  app:
    image: linuxserver/vscodium-web:1.140.06880@sha256:5907b6ec2b6a306aec3a330b82ab54c36a97a550db1a7919b65e4ffabdb7fc58
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
