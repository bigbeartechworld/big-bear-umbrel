version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wikijs_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/wikijs:2.5.317@sha256:e5a37b0658cb3b0fdc194e2a09762f5cce3aaa00a9ca84b90c8cdf409389698d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: $DB_TYPE
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
      DB_USER: $DB_USER
      DB_PASS: $DB_PASS
    volumes:
      - type: bind
        source: /DATA/AppData/wikijs/config
        target: /config
      - type: bind
        source: /DATA/AppData/wikijs/data
        target: /data
