version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-wikijs_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/wikijs:2.5.314@sha256:b8bcc7c1662ac19d8448627e6179950ce01838bb9e12177b5396d70d6be64c8b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: $DB_TYPE
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
      DB_USER: $DB_USER
      DB_PASS: $DB_PASS
    volumes:
      - type: bind
        source: /DATA/AppData/wikijs/config
        target: /config
      - type: bind
        source: /DATA/AppData/wikijs/data
        target: /data
