version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-librespeed_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/librespeed:6.3.1@sha256:0f85aac620b60a2566049f95d085fd2b044c720abfe88d1f1e14496ea0496833
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
