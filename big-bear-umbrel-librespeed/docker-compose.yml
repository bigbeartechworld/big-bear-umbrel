version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-librespeed_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/librespeed:6.3.1@sha256:8f383ce2954aca618347387e255769b9a927c549daa3f29c12a18b418acb5193
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
