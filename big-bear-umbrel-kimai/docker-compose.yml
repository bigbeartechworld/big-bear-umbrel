version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kimai_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/kimai:2.70.2@sha256:564810851b688cb84dec04bbc047ce971bc2fedb84422dd50a8b617ebb838893
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
