version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-kimai_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/kimai:2.71.0@sha256:69330bf42a65e17648b494e7f4c2751c4e1deb4039fa5476595aaf6b8fbf2e2e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
