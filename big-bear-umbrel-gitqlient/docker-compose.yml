version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-gitqlient_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:5b0c580c1c772ce49b57d36c2800833215a21f3a79470179bb8480d62df74d73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
