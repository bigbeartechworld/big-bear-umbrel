version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-gitqlient_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:69d602cdd9e90633f27ecd8fccad908996983ee305ff2e511fd502a3d625c0f7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
