version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-airsonic-advanced_app_1
      APP_PORT: ' 4040'
  app:
    image: linuxserver/airsonic-advanced:11.1.4@sha256:bae6dde843d7e207e4f97322c4e5cacf57f6ad10000a1e70a901d273cd4ff237
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
      JAVA_OPTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/airsonic-advanced/config
        target: /config
      - type: bind
        source: /DATA/AppData/airsonic-advanced/music
        target: /music
      - type: bind
        source: /DATA/AppData/airsonic-advanced/playlists
        target: /playlists
      - type: bind
        source: /DATA/AppData/airsonic-advanced/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/airsonic-advanced/media
        target: /media
