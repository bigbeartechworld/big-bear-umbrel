version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-airsonic-advanced_app_1
      APP_PORT: ' 4040'
  app:
    image: linuxserver/airsonic-advanced:11.1.4@sha256:a0945c317c94380f0f06abcbab36f49a13ad5c2741e26cd0fbc670a061ef5548
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
      JAVA_OPTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/airsonic-advanced/config
        target: /config
      - type: bind
        source: /DATA/AppData/airsonic-advanced/music
        target: /music
      - type: bind
        source: /DATA/AppData/airsonic-advanced/playlists
        target: /playlists
      - type: bind
        source: /DATA/AppData/airsonic-advanced/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/airsonic-advanced/media
        target: /media
