version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-airsonic-advanced_app_1
      APP_PORT: ' 4040'
  app:
    image: linuxserver/airsonic-advanced:11.1.4@sha256:e9272f1fb326c25ebb41c8b26441edd15b51985a375711cb338556c14d3d6d5d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
      JAVA_OPTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/airsonic-advanced/config
        target: /config
      - type: bind
        source: /DATA/AppData/airsonic-advanced/music
        target: /music
      - type: bind
        source: /DATA/AppData/airsonic-advanced/playlists
        target: /playlists
      - type: bind
        source: /DATA/AppData/airsonic-advanced/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/airsonic-advanced/media
        target: /media
