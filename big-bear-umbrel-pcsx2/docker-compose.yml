version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pcsx2_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:4e7e61591f06b4f7ba94065888e70093f99b04644b0460baaa262ef896f2077c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
