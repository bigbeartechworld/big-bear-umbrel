version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-plex-meta-manager_app_1
      APP_PORT: "8080"
  app:
    image: linuxserver/plex-meta-manager:1.21.1@sha256:7703177e6f29ac7bbe555a7f6c21dd05e59af3bd885582933059ce660ae5536f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PMM_CONFIG: ''
      PMM_TIME: ''
      PMM_RUN: ''
      PMM_TEST: ''
      PMM_NO_MISSING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/plex-meta-manager/config
        target: /config
