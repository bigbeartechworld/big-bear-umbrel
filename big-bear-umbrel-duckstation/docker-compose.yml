version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-duckstation_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/duckstation:version-latest@sha256:367a18e9e821d3bd46e480627b634556f29c98675c667454c2cac32d09817860
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
