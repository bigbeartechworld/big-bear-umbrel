version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-cops_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/cops:4.5.4@sha256:c2ce7e22a4315aeb06d19c796f9a2b6c5c73dabbd20c528d91a8b729b6ebb182
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
