version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-cops_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/cops:4.5.2@sha256:56ea339f9f9f885dd1105396e69705e84d6334c2e187bd6be98b212453d3a7cc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
