version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-cops_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/cops:4.5.4@sha256:cd1ad4508f3d416a853a42179cae7fce4170b06563511b4d35748d229cda9163
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
