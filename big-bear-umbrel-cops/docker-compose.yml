version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-cops_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/cops:4.6.1@sha256:6bff3641983186cae8a78df4ab5c831ca593e2378cc48a7c923452911646d092
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
