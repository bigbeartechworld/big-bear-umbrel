version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-altus_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/altus:5.8.1@sha256:e4df4114c1cc350bb475c4d2f6616dcf434659cf4557fa8738759c089fd51fea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
