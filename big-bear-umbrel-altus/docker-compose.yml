version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-altus_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/altus:5.8.1@sha256:5f40cab7138d484196890ed773a2a71ed78576a28ad0b73a5d7ff9ab0de3d323
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
