version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-altus_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/altus:5.8.1@sha256:d0da41e0bf3cbd7e2632f01e607942609babe17610d3008132bfce828f337fd9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
