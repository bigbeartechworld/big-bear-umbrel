version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-altus_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/altus:5.8.1@sha256:0c9ef18b4f0182043204b6833855777409ec775294d76cea9540b941456b175c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
