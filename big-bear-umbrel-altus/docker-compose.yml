version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-altus_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/altus:5.8.1@sha256:d25458c497a012bf22733f99bb7d54c0a08575f2760ac1adf4a4b152c74c3b43
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
