version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-gamevault_gamevault_1
      APP_PORT: "8080"
  gamevault:
    image: phalcode/gamevault-backend:17.1.0@sha256:87999b98d686b3297ddd7abde51f42dd2fa30b987f0cf050a42403a398711199
    restart: unless-stopped
    depends_on:
      gamevault-db:
        condition: service_healthy
    environment:
      DB_HOST: gamevault-db
      DB_USERNAME: gamevault
      DB_PASSWORD: 02386af9-382f-49ad-841b-060735fd14d7
    volumes:
      - ${APP_DATA_DIR}/files:/files
      - ${APP_DATA_DIR}/media:/media
  gamevault-db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamevault
      POSTGRES_PASSWORD: 02386af9-382f-49ad-841b-060735fd14d7
      POSTGRES_DB: gamevault
    volumes:
      - ${APP_DATA_DIR}/database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamevault -d gamevault"]
      interval: 10s
      timeout: 5s
      retries: 5
