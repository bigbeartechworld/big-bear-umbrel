version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-orcaslicer_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:bce31f2bfa6e7984855c8dabe1492e55bbe3e0095621892a37d04161e9194c72
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
