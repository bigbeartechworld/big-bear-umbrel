version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-orcaslicer_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:636971671567f995a9f77b2b4681ec744a92136f744866a2b0b75cf04d434c30
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
