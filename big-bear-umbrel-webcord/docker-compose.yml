version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webcord_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webcord:4.14.0@sha256:8de4b17b439fedf53ef929646099812fb5506fc17a01222bd93858b3c6c1f056
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
