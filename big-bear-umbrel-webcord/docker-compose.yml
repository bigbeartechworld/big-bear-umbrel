version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webcord_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webcord:4.14.0@sha256:1a411f2a5c679bc0839301a7618e05b819ada9000b9792b52b55f3387c47d52b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
