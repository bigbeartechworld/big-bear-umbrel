version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-webcord_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/webcord:4.14.0@sha256:9e58513901ec68387a81ac76f159bd262136e914ec5ae6d0c4a538fe8ff81fec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
