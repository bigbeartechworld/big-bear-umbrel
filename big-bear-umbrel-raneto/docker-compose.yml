version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-raneto_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/raneto:0.18.1@sha256:a460ac8aa367ffe0f6af7474148eb66bd8bb08508b4c78a3d65b18f98b7670e4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
