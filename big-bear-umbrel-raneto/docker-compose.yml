version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-raneto_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/raneto:0.18.1@sha256:cf9d477e458b039f121ae12bca48e1d00b7c9b45cd85e6b5ccc166cf5b3757f3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
