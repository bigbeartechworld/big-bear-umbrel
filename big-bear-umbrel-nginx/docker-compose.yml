version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-nginx_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/nginx:1.30.4@sha256:c6c300bd5959e340d8742359f59604f3ad21426ea905cc77e75b01345034c8c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NGINX_AUTORELOAD: ''
      NGINX_AUTORELOAD_WATCHLIST: ''
    volumes:
      - type: bind
        source: /DATA/AppData/nginx/config
        target: /config
