version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-nginx_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/nginx:1.30.4@sha256:34e67960f3f818f3d87fdd773e328b53b24c91c64b4c1e4f6d7b22bc175ee174
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NGINX_AUTORELOAD: ''
      NGINX_AUTORELOAD_WATCHLIST: ''
    volumes:
      - type: bind
        source: /DATA/AppData/nginx/config
        target: /config
