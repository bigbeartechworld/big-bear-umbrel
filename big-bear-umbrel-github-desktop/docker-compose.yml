version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-github-desktop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:cb31c4f5abd0e89d02532c932a37f4fd62b79d39f2163975eace8c8a732c969b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
