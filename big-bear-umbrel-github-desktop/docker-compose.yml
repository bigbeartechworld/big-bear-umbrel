version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-github-desktop_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:8651e12fa3c6418b3a6f1a745ec629e9923294c52a653a87d81983a4bbaeba07
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
