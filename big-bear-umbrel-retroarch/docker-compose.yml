version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-retroarch_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/retroarch:1.22.2@sha256:2440c95f043100d8c1bdd31fcf7f5a44427ae2395f0fd9a0d087cdb9ef04041c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
