version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yq_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/yq:4.4.5@sha256:eee6452e10e8b990405e68d0c201c5bd6c688271af23a7789b66e514d3cb8fc4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
