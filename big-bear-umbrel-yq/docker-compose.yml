version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yq_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/yq:3.4.3@sha256:adf84aa50f4c1bf87a000797ab6cf39dfe23395cd2b9a22544425fce8d0c2160
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
