version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yq_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/yq:4.4.0@sha256:f83757f22c2d330aa56ed1dfc93beb92b488ad2d0085aaa3dd076e6c12f9f260
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
