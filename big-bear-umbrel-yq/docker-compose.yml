version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-yq_app_1
      APP_PORT: ' 80'
  app:
    image: linuxserver/yq:4.4.5@sha256:30dca795585e8a0f10534c3ad15ff391a7b86258d3c4c24bf165ce262349849f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
