# Configuration for budibase setup
# Name of the big-bear-budibase application
version: "3.7"
# Service definitions for the big-bear-budibase application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-budibase_big-bear-budibase_1
      APP_PORT: "80"
  # Service name: big-bear-budibase
  # The `big-bear-budibase` service definition
  big-bear-budibase:
    # Image to be used for the container
    image: budibase/budibase:3.41.3@sha256:f05b90c2b8afc951feb99931bb4646d2c94af37d9c576ef3c4e01d4fdc296dc1
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      # Mounting the local directory ${APP_DATA_DIR}/data to /data in the container
      - ${APP_DATA_DIR}/data:/data
