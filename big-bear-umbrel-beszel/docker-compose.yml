# Configuration for beszel setup
# Name of the big-bear-beszel application
version: "3.7"
# Service definitions for the big-bear-beszel application
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-beszel_big-bear-beszel_1
      APP_PORT: "8090"
  # Service name: big-bear-beszel
  # The `big-bear-beszel` service definition
  big-bear-beszel:
    # Image to be used for the container
    image: henrygd/beszel:0.21.0@sha256:6b39a8b64f9b15d00a25e7683e31a93c46161182a54f62713525107064e10599
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/data:/beszel_data
