version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-pycharm_app_1
      APP_PORT: ' 3000'
  app:
    image: linuxserver/pycharm:2026.2.20260811@sha256:5ea4f8c48828b48ab4ddd35adac1cd7464975b78897c5afa07f64a947f31ed76
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pycharm/config
        target: /config
